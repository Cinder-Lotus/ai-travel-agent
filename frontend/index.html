<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente de Viajes IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h2>✈️ Asistente de Viajes IA</h2>
        </header>
        
        <main id="chat-box" class="chat-box">
            <div class="message model">
                <p>¡Hola! Soy tu agente de viajes. ¿A dónde te gustaría viajar desde Cali o qué tipo de aventura buscas?</p>
            </div>
        </main>
        
        <footer class="chat-input-area">
            <input type="text" id="user-input" placeholder="Escribe aquí tu destino, presupuesto o fechas..." autocomplete="off">
            <button id="send-btn">Enviar</button>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
